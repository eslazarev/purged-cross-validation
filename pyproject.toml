[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purgedcv"
version = "0.3.0a0"
description = "scikit-learn-compatible cross-validation for time-series machine learning: purging, embargoes, combinatorial backtest paths."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evgenii Lazarev" }]
keywords = [
    "time-series",
    "cross-validation",
    "machine-learning",
    "scikit-learn",
    "purged-kfold",
    "combinatorial-cv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pre-commit>=3.5",
]
examples = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/eslazarev/purged-cross-validation"
Repository = "https://github.com/eslazarev/purged-cross-validation"

[tool.hatch.build.targets.wheel]
packages = ["src/purgedcv"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
markers = [
    "e2e: end-to-end tests exercising the public API as a user would (may spawn subprocesses)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = false
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true
