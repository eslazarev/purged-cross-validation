site_name: purgedcv
site_description: scikit-learn-compatible purged and combinatorial cross-validation for time-series and financial machine learning
site_url: https://eslazarev.github.io/purged-cross-validation/
repo_url: https://github.com/eslazarev/purged-cross-validation
repo_name: eslazarev/purged-cross-validation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
  - include-markdown
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        purgedcv is an MIT-licensed, scikit-learn-compatible Python package for
        leakage-aware cross-validation on time-series and financial data. Every
        splitter needs prediction_times (when the prediction is made, sorted) and
        evaluation_times (when the label is known).
      sections:
        Start here:
          - index.md: What the package does and when you need it
          - installation.md: pip and conda installation, accepted time inputs
          - quickstart.md: Runnable walkthrough from purge to PBO
          - choosing-a-splitter.md: Which splitter fits which validation question
          - common-mistakes.md: Typical leakage errors and the messages purgedcv raises
        API reference:
          - api.md
          - api/*.md
        Background:
          - methodology.md
          - examples.md

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Choosing a splitter: choosing-a-splitter.md
  - Common mistakes: common-mistakes.md
  - API reference:
      - Overview: api.md
      - Splitters: api/splitters.md
      - Purge and embargo: api/primitives.md
      - Backtest paths: api/paths.md
      - Statistical metrics: api/metrics.md
      - Backtest overfitting and Optuna: api/overfitting.md
      - Diagnostics and exceptions: api/diagnostics.md
      - Time inputs and utilities: api/time.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Methodology: methodology.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/api-redirects.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eslazarev/purged-cross-validation
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/purgedcv/
