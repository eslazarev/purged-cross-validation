site_name: purgedcv
site_description: scikit-learn-compatible purged and combinatorial cross-validation for time-series and financial machine learning
site_url: https://eslazarev.github.io/purged-cross-validation/
repo_url: https://github.com/eslazarev/purged-cross-validation
repo_name: eslazarev/purged-cross-validation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
  - include-markdown

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - API reference: api.md
  - Examples: examples.md
  - Methodology: methodology.md
  - Paper (JOSS): paper.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eslazarev/purged-cross-validation
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/purgedcv/
