name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-version:
    # Never give a fork write access. The helper comes from the trusted base,
    # not from the PR checkout; no PR code is installed or executed here.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pr-version-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: release-tools
          persist-credentials: false

      - name: Check out the working PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update version in this PR
        id: update
        working-directory: candidate
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git check-ref-format "refs/heads/$PR_BRANCH"
          if [ "$PR_BRANCH" = main ] || [ "$PR_BRANCH" = master ]; then
            echo "Refusing to push version metadata to a protected base branch."
            exit 1
          fi
          tip=$(git ls-remote --exit-code origin "refs/heads/$PR_BRANCH" | cut -f1)
          if [ "$tip" != "$PR_HEAD" ]; then
            echo "A newer PR head supersedes this run."
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f ../release-tools/tools/prepare_pr_release.py ]; then
            echo "Bootstrap PR: trusted main does not have the helper yet."
            echo "Include the version bump in this PR manually."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          base=$(git rev-parse origin/main)
          python ../release-tools/tools/prepare_pr_release.py \
            --root . --base "$base" --head "$PR_HEAD"
          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pyproject.toml src/purgedcv/__init__.py CITATION.cff
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            commit -m "chore: prepare release metadata"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Version added to this PR. Run CI on the new head; approve pending workflows if asked."

  test:
    needs: [pr-version]
    if: >-
      always() && !cancelled() &&
      (needs.pr-version.result == 'success' || needs.pr-version.result == 'skipped') &&
      needs.pr-version.outputs.updated != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check src tests tools examples/_lcl_harness.py

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q --cov=purgedcv --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Mkdocs build (strict)
        run: mkdocs build --strict

  # Validate the citation metadata and guard against version drift. Runs
  # once (not across the Python matrix) because it is a static-file check.
  citation:
    needs: [pr-version]
    if: >-
      always() && !cancelled() &&
      (needs.pr-version.result == 'success' || needs.pr-version.result == 'skipped') &&
      needs.pr-version.outputs.updated != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CITATION.cff against the CFF schema
        run: |
          python -m pip install --upgrade pip cffconvert
          cffconvert --validate

      - name: Check CITATION.cff version matches pyproject.toml
        run: python tools/sync_citation.py --check

      - name: Check version metadata is included in the working PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/prepare_pr_release.py --root . --base "$PR_BASE" --head "$PR_HEAD" --check

  # Code and version metadata merge together. Only a tested version-changing
  # push to main publishes; PR events never receive publication credentials.
  release:
    needs: [test, citation]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plan release
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python tools/release.py plan --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        if: steps.plan.outputs.mode == 'publish'
        run: python -m pip install build twine

      - name: Build
        if: steps.plan.outputs.mode == 'publish'
        run: |
          python -m build
          python -m twine check dist/*

      - name: GitHub Release
        if: steps.plan.outputs.mode == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.plan.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "v${{ steps.plan.outputs.version }}"
          body: "Release of the tested main commit ${{ github.sha }}."
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retry the original merge run after a failure; never bump again just
      # to retry an upload. plan verifies that any existing tag has this SHA.
      - name: Publish to PyPI
        if: steps.plan.outputs.mode == 'publish'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
