name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check src tests tools examples/_lcl_harness.py

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q --cov=purgedcv --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Mkdocs build (strict)
        run: mkdocs build --strict

  # Validate the citation metadata and guard against version drift. Runs
  # once (not across the Python matrix) because it is a static-file check.
  citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CITATION.cff against the CFF schema
        run: |
          python -m pip install --upgrade pip cffconvert
          cffconvert --validate

      - name: Check CITATION.cff version matches pyproject.toml
        run: python tools/sync_citation.py --check

  # Version changes go through a draft PR. Only a tested version-changing
  # push to main publishes; PR events never receive release credentials.
  release:
    needs: [test, citation]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plan release
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python tools/release.py plan --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

      - name: Check whether this is still the latest main commit
        if: steps.plan.outputs.mode == 'prepare'
        id: tip
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit will prepare the release PR."
          fi

      - name: Prepare version files
        if: steps.plan.outputs.mode == 'prepare' && steps.tip.outputs.current == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: python tools/release.py prepare --version "$VERSION"

      - name: Open or update draft release PR
        if: steps.plan.outputs.mode == 'prepare' && steps.tip.outputs.current == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release/v${{ steps.plan.outputs.version }}
          add-paths: |
            pyproject.toml
            src/purgedcv/__init__.py
            CITATION.cff
          commit-message: "chore: release v${{ steps.plan.outputs.version }}"
          title: "chore: release v${{ steps.plan.outputs.version }}"
          draft: always-true
          body: |
            Prepare version ${{ steps.plan.outputs.version }} for release.

            This PR changes only the package version and citation metadata.
            Mark it **Ready for review** to trigger CI, approve any pending
            workflow run if GitHub requests it, and wait for the checks before merging.
            The version-changing merge to main will be tested again, then tagged
            and published to PyPI. No direct push to main is used.

      - name: Install build tooling
        if: steps.plan.outputs.mode == 'publish'
        run: python -m pip install build twine

      - name: Build
        if: steps.plan.outputs.mode == 'publish'
        run: |
          python -m build
          python -m twine check dist/*

      - name: GitHub Release
        if: steps.plan.outputs.mode == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.plan.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "v${{ steps.plan.outputs.version }}"
          body: "Release of the tested main commit ${{ github.sha }}."
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retry the original merge run after a failure; never bump again just
      # to retry an upload. plan verifies that any existing tag has this SHA.
      - name: Publish to PyPI
        if: steps.plan.outputs.mode == 'publish'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
